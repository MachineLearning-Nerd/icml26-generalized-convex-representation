[project]
name = "universal-gconvex-reproduction"
version = "0.1.0"
description = "Claim-by-claim reproduction of arXiv:2509.04477v1"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cvxpy==1.6.5",
  "marimo==0.14.17",
  "matplotlib==3.10.3",
  "numpy==1.26.4",
  "pot==0.9.5",
  "scipy==1.15.3",
  "torch==2.7.1",
  "z3-solver==4.15.1.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
