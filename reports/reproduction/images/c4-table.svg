<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Table I reported differences</title>
  <desc id="desc">Learned and benchmark revenues are equal for one and two goods and differ by negative one thousandth for five and ten goods.</desc>
  <rect width="1000" height="460" fill="#fff"/>
  <text x="60" y="55" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#0f172a">“Exact” agreement breaks at five and ten goods</text>
  <text x="60" y="87" font-family="system-ui,sans-serif" font-size="17" fill="#64748b">Learned per-item revenue minus Straight-Jacket benchmark, reported precision</text>
  <line x1="100" y1="220" x2="920" y2="220" stroke="#334155" stroke-width="2"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="145" y="218" width="100" height="2" fill="#0ea5e9"/><text x="195" y="205" fill="#0f766e" font-size="18" font-weight="700">0.000</text><text x="195" y="390" fill="#475569" font-size="18">n=1</text>
    <rect x="345" y="218" width="100" height="2" fill="#0ea5e9"/><text x="395" y="205" fill="#0f766e" font-size="18" font-weight="700">0.000</text><text x="395" y="390" fill="#475569" font-size="18">n=2</text>
    <rect x="545" y="220" width="100" height="130" rx="4" fill="#ef4444"/><text x="595" y="375" fill="#991b1b" font-size="18" font-weight="700">−0.001</text><text x="595" y="410" fill="#475569" font-size="18">n=5</text>
    <rect x="745" y="220" width="100" height="130" rx="4" fill="#ef4444"/><text x="795" y="375" fill="#991b1b" font-size="18" font-weight="700">−0.001</text><text x="795" y="410" fill="#475569" font-size="18">n=10</text>
  </g>
  <text x="60" y="445" font-family="system-ui,sans-serif" font-size="14" fill="#64748b">A ≤0.001 tolerance would pass all rows; exact equality does not.</text>
</svg>
