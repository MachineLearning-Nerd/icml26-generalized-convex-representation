<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Nonquadratic twist map recovery error</title>
  <desc id="desc">Maximum inverse error is about three times ten to the minus fifteen in dimensions two, four, and eight; the non-twist control has error one.</desc>
  <rect width="1000" height="480" fill="#fff"/>
  <text x="55" y="55" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Twist inversion remains at floating-point precision through d=8</text>
  <text x="55" y="86" font-family="system-ui,sans-serif" font-size="17" fill="#64748b">Phi(x,y)=Σ xᵢ(yᵢ+aᵢyᵢ³); independent coordinate root finder</text>
  <line x1="110" y1="390" x2="920" y2="390" stroke="#94a3b8" stroke-width="2"/>
  <line x1="110" y1="125" x2="110" y2="390" stroke="#94a3b8" stroke-width="2"/>
  <g font-family="system-ui,sans-serif" font-size="14" fill="#64748b" text-anchor="end">
    <text x="98" y="395">10⁻¹⁵</text><text x="98" y="325">10⁻¹¹</text><text x="98" y="255">10⁻⁷</text><text x="98" y="185">10⁻³</text><text x="98" y="130">1</text>
  </g>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="180" y="375" width="105" height="15" rx="4" fill="#0ea5e9"/><text x="232" y="362" fill="#0369a1" font-size="16">3.11e−15</text><text x="232" y="425" fill="#475569" font-size="17">d=2</text>
    <rect x="370" y="376" width="105" height="14" rx="4" fill="#0ea5e9"/><text x="422" y="363" fill="#0369a1" font-size="16">2.78e−15</text><text x="422" y="425" fill="#475569" font-size="17">d=4</text>
    <rect x="560" y="375" width="105" height="15" rx="4" fill="#0ea5e9"/><text x="612" y="362" fill="#0369a1" font-size="16">3.11e−15</text><text x="612" y="425" fill="#475569" font-size="17">d=8</text>
    <rect x="750" y="125" width="105" height="265" rx="4" fill="#ef4444"/><text x="802" y="112" fill="#991b1b" font-size="16">1.0</text><text x="802" y="425" fill="#475569" font-size="17">non-twist</text>
  </g>
  <text x="55" y="462" font-family="system-ui,sans-serif" font-size="14" fill="#64748b">Control: gradₓ(xy²)=y² cannot distinguish y=−1/2 from y=+1/2.</text>
</svg>
